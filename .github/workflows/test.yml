name: Tests

on:
  push:
    branches:
     - master
  pull_request_target:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps: 
      - uses: DevExpress/testcafe-build-system/actions/prepare@main
      
      - uses: DevExpress/testcafe-build-system/actions/build@main

      - name: List files produced by build
        shell: bash
        run: |
          echo "--- .builds ---"
          ls -la .builds || echo ".builds does not exist"
          echo "--- package-lock.json ---"
          ls -la package-lock.json || echo "package-lock.json does not exist"

      - name: Download uploaded 'npm' artifact for inspection
        uses: actions/download-artifact@v4
        with:
          name: npm
          path: ${{ runner.temp }}/npm-artifact-check

      - name: List files actually uploaded in 'npm' artifact
        shell: bash
        run: ls -laR "${{ runner.temp }}/npm-artifact-check"

  test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: DevExpress/testcafe-build-system/actions/prepare@main

      - name: Download 'npm' artifact for inspection
        uses: actions/download-artifact@v4
        with:
          name: npm
          path: ${{ runner.temp }}/npm-artifact-check

      - name: List files in 'npm' artifact before test-npm
        shell: bash
        run: |
          ls -laR "${{ runner.temp }}/npm-artifact-check"
          test -d "${{ runner.temp }}/npm-artifact-check/.builds" || echo "::error::.builds is missing from the 'npm' artifact"

      - uses: DevExpress/testcafe-build-system/actions/test-npm@main
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        with:
          task: test
 
